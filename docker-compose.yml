services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-server
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - job-network

  job-automation:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: job-automation-app
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=gemma2:9b
      - LOG_LEVEL=INFO
    networks:
      - job-network
    stdin_open: false
    tty: false
    restart: "no"

networks:
  job-network:
    driver: bridge

volumes:
  ollama_data:
    driver: local